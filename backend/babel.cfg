# Developer-only pages - the Alpine pattern reference, the service layer docs,
# the component showcase and the dev dashboard - are English-language technical
# reference for the people building this app, not product text. Extracting them
# put 471 entries in front of translators for no benefit, so they are ignored
# here. The strings stay wrapped in `_()`; with no catalogue entry they simply
# render in English. `ignore` patterns must come first: the first pattern that
# matches a file wins.
[ignore: **/templates/backoffice/patterns.html]
[ignore: **/templates/backoffice/patterns/**.html]
[ignore: **/templates/backoffice/service_docs.html]
[ignore: **/templates/backoffice/service_docs/**.html]
[ignore: **/templates/backoffice/showcase.html]
[ignore: **/templates/backoffice/showcase/**.html]
[ignore: **/templates/backoffice/dev_dashboard.html]
[ignore: **/entrypoints/blueprints/dev.py]

[python: **.py]
keywords = _l N_
[jinja2: **/templates/**.html]
