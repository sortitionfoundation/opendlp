    <style>
  /* Tokens lifted from backoffice design system (primitive + semantic) */
      :root {
        --brand-50:#FBE7EF; --brand-100:#F4B6CB; --brand-200:#E682A4; --brand-300:#C70039;
        --brand-400:#90003F; --brand-600:#720046; --brand-700:#5E003A;
        --n0:#FFFFFF; --n50:#F7F7F8; --n100:#EFEFF1; --n200:#E1E2E5; --n300:#C8CAD0;
        --n400:#9EA2AC; --n500:#6F7482; --n600:#4E5361; --n700:#2F3442; --n800:#1F2330;
        --success-100:#E6F4EA; --success-400:#2E8B57; --success-600:#1F6A42;
        --warning-100:#FFF4E5; --warning-400:#D9822B; --warning-600:#A6631E;
        --info-100:#E8F1FA; --info-400:#3A7BD5; --info-600:#2B5FA6;
        --error-100:#FDEBEC; --error-400:#C70039; --error-600:#90003F;
        --radius:8px;
      }
      * { box-sizing:border-box; }
      html,body { margin:0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background:var(--n50); color:var(--n600); line-height:1.5;
      }
      h1,h2,h3,h4 { color:var(--n700); line-height:1.25; margin:0 0 .5rem; }
      p { margin:0 0 .75rem; }
      a { color:var(--brand-400); }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.85em; }

  /* ---- top bar ---- */
      .appbar { background:var(--n800); color:var(--n0); padding:.75rem 1.5rem; display:flex; align-items:center; gap:.75rem; }
      .appbar .logo { width:26px;height:26px;border-radius:6px;background:var(--brand-400); display:grid;place-items:center;font-weight:700;font-size:.8rem; }
      .appbar .title { font-weight:600; }
      .appbar .sub { color:var(--n400); font-size:.85rem; margin-left:.25rem; }
      .demo-flag { margin-left:auto; background:var(--warning-100); color:var(--warning-600); border:1px solid var(--warning-400); padding:.15rem .55rem; border-radius:999px; font-size:.72rem; font-weight:600; letter-spacing:.02em; }

  /* ---- progress steps ---- */
      .steps { background:var(--n0); border-bottom:1px solid var(--n200); padding:0 1.5rem; display:flex; gap:.25rem; overflow-x:auto; }
      .step { appearance:none; background:none; border:none; cursor:pointer; padding:.9rem .7rem; display:flex; align-items:center; gap:.45rem;
        color:var(--n500); font-size:.88rem; font-family:inherit; border-bottom:3px solid transparent; white-space:nowrap; }
      .step:hover { color:var(--n700); }
      .step .num { width:1.4rem;height:1.4rem;border-radius:50%; background:var(--n200); color:var(--n600); display:grid;place-items:center; font-size:.78rem; font-weight:700; }

  /* ---- layout ---- */

      .stage-head h2 { font-size:1.6rem; }

  /* ---- buttons ---- */

      .btn-sm { padding:.3rem .65rem; font-size:.82rem; }

      .iconbtn { background:transparent; border:1px solid var(--n200); border-radius:6px; cursor:pointer; width:1.85rem; height:1.85rem; display:grid; place-items:center; color:var(--n500); font-size:.95rem; }

      .gov-fieldset { border:0; padding:0; margin:0 0 1.6rem; }
      .gov-legend { font-size:1.15rem; font-weight:700; color:var(--n700); border-bottom:2px solid var(--brand-400); padding-bottom:.3rem; margin-bottom:.8rem; }
      .gov-field { margin:0 0 1rem; }
      .gov-field > label, .gov-field > .gov-q { display:block; font-weight:600; color:var(--n700); margin-bottom:.25rem; }
      .gov-hint { color:var(--n500); font-size:.85rem; margin-bottom:.35rem; }
      .gov-field input[type=text], .gov-field input[type=email], .gov-field input[type=tel], .gov-field select {
        width:100%; padding:.5rem .55rem; border:2px solid var(--n700); border-radius:4px; font-family:inherit; font-size:.95rem;
      }
      .gov-opt { display:flex; align-items:center; gap:.5rem; margin:.3rem 0; }
      .gov-submit { background:var(--success-400); color:#fff; border:0; border-radius:4px; padding:.65rem 1.2rem; font-size:1rem; font-weight:700; cursor:pointer; }

      .summary-row { display:flex; justify-content:space-between; gap:1rem; padding:.45rem .2rem; border-bottom:1px solid var(--n100); font-size:.9rem; }
      .summary-row .k { color:var(--n500); }

      .hidden { display:none !important; }
      .hintline { font-size:.82rem; color:var(--n500); margin:.4rem 0 0; }
      details.helper { margin:.5rem 0; }
      details.helper summary { cursor:pointer; color:var(--brand-400); font-size:.85rem; }

    <script>
      "use strict";

/* ================================================================== *
 * Self-contained QR encoder (byte mode, single Reed-Solomon block,    *
 * EC level L, auto-sized versions 1-5). Enough for a short URL, no    *
 * external library or network needed.                                 *
 * ================================================================== */
      const QR = (function () {
        const EXP = new Array(256), LOG = new Array(256);
        (function () { let x = 1; for (let i = 0; i < 256; i++) { EXP[i] = x; x <<= 1; if (x & 0x100) x ^= 0x11d; } for (let i = 0; i < 255; i++) LOG[EXP[i]] = i; })();
        const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[(LOG[a] + LOG[b]) % 255];
        function genPoly(n) { let p = [1]; for (let i = 0; i < n; i++) { const np = new Array(p.length + 1).fill(0); for (let j = 0; j < p.length; j++) { np[j] ^= p[j]; np[j + 1] ^= gmul(p[j], EXP[i]); } p = np; } return p; }
        function rsEnc(data, ecLen) { const g = genPoly(ecLen); const buf = data.concat(new Array(ecLen).fill(0)); for (let i = 0; i < data.length; i++) { const c = buf[i]; if (c) for (let j = 0; j < g.length; j++) buf[i + j] ^= gmul(g[j], c); } return buf.slice(data.length); }
        const VER = { 1:{tot:19,ec:7}, 2:{tot:34,ec:10}, 3:{tot:55,ec:15}, 4:{tot:80,ec:20}, 5:{tot:108,ec:26} };
        const ALIGN = { 1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30] };
        function utf8(str) { const o = []; for (const ch of str) { let c = ch.codePointAt(0);
          if (c < 0x80) o.push(c);
          else if (c < 0x800) o.push(0xc0|(c>>6), 0x80|(c&0x3f));
          else if (c < 0x10000) o.push(0xe0|(c>>12), 0x80|((c>>6)&0x3f), 0x80|(c&0x3f));
          else o.push(0xf0|(c>>18), 0x80|((c>>12)&0x3f), 0x80|((c>>6)&0x3f), 0x80|(c&0x3f)); } return o; }
        function chooseVer(len) { const need = Math.ceil((4 + 8 + 8 * len) / 8); for (let v = 1; v <= 5; v++) if (VER[v].tot >= need) return v; throw new Error("Data too long for demo QR"); }
        function pushBits(arr, val, len) { for (let i = len - 1; i >= 0; i--) arr.push((val >> i) & 1); }
        function bits2bytes(bits) { const o = []; for (let i = 0; i < bits.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | (bits[i + j] || 0); o.push(v); } return o; }
        function getMask(m, i, j) { switch (m) {
          case 0: return (i + j) % 2 === 0;
          case 1: return i % 2 === 0;
          case 2: return j % 3 === 0;
          case 3: return (i + j) % 3 === 0;
          case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0;
          case 5: return ((i * j) % 2 + (i * j) % 3) === 0;
          case 6: return (((i * j) % 2 + (i * j) % 3)) % 2 === 0;
          case 7: return (((i + j) % 2 + (i * j) % 3)) % 2 === 0; } }
        function bchDigit(d) { let n = 0; while (d !== 0) { n++; d >>>= 1; } return n; }
        function bchType(data) { let d = data << 10; while (bchDigit(d) - bchDigit(0x537) >= 0) d ^= (0x537 << (bchDigit(d) - bchDigit(0x537))); return ((data << 10) | d) ^ 0x5412; }

        function place(size, ver, all, mask) {
          const m = Array.from({ length: size }, () => new Array(size).fill(null));
          function finder(r, c) { for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) { const rr = r + dr, cc = c + dc; if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
            const on = (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) || (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4); m[rr][cc] = on; } }
          finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
          const pos = ALIGN[ver];
          for (const r of pos) for (const c of pos) { if (m[r][c] !== null) continue; for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) m[r + dr][c + dc] = (dr === -2 || dr === 2 || dc === -2 || dc === 2 || (dr === 0 && dc === 0)); }
          for (let i = 8; i < size - 8; i++) { if (m[i][6] === null) m[i][6] = (i % 2 === 0); if (m[6][i] === null) m[6][i] = (i % 2 === 0); }
          const fmt = bchType((1 << 3) | mask); // EC level L = 1
          for (let i = 0; i < 15; i++) { const bit = ((fmt >> i) & 1) === 1;
            if (i < 6) m[i][8] = bit; else if (i < 8) m[i + 1][8] = bit; else m[size - 15 + i][8] = bit;
            if (i < 8) m[8][size - i - 1] = bit; else if (i < 9) m[8][15 - i - 1 + 1] = bit; else m[8][15 - i - 1] = bit; }
          m[size - 8][8] = true; // dark module
          let bitIdx = 7, byteIdx = 0, dir = -1, row = size - 1;
          for (let col = size - 1; col > 0; col -= 2) { if (col === 6) col--;
            while (true) { for (let cc = 0; cc < 2; cc++) { const c = col - cc; if (m[row][c] === null) {
              let dark = false; if (byteIdx < all.length) dark = ((all[byteIdx] >>> bitIdx) & 1) === 1;
              if (getMask(mask, row, c)) dark = !dark; m[row][c] = dark;
              bitIdx--; if (bitIdx < 0) { byteIdx++; bitIdx = 7; } } }
              row += dir; if (row < 0 || row >= size) { row -= dir; dir = -dir; break; } } }
          return m;
        }
        function matchSeq(m, i, j, horiz, pat) { for (let k = 0; k < 11; k++) { const v = horiz ? m[i][j + k] : m[j + k][i]; if ((v ? true : false) !== pat[k]) return false; } return true; }
        function penalty(m, size) { let p = 0;
          for (let i = 0; i < size; i++) { let rc = 1, cc = 1; for (let j = 1; j < size; j++) {
            if (m[i][j] === m[i][j - 1]) rc++; else { if (rc >= 5) p += 3 + (rc - 5); rc = 1; }
            if (m[j][i] === m[j - 1][i]) cc++; else { if (cc >= 5) p += 3 + (cc - 5); cc = 1; } }
            if (rc >= 5) p += 3 + (rc - 5); if (cc >= 5) p += 3 + (cc - 5); }
          for (let i = 0; i < size - 1; i++) for (let j = 0; j < size - 1; j++) { const v = m[i][j]; if (v === m[i][j + 1] && v === m[i + 1][j] && v === m[i + 1][j + 1]) p += 3; }
          const p1 = [true,false,true,true,true,false,true,false,false,false,false];
          const p2 = [false,false,false,false,true,false,true,true,true,false,true];
          for (let i = 0; i < size; i++) for (let j = 0; j <= size - 11; j++) {
            if (matchSeq(m, i, j, true, p1) || matchSeq(m, i, j, true, p2)) p += 40;
            if (matchSeq(m, i, j, false, p1) || matchSeq(m, i, j, false, p2)) p += 40; }
          let dark = 0; for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) if (m[i][j]) dark++;
          p += Math.floor(Math.abs(Math.floor(100 * dark / (size * size)) - 50) / 5) * 10;
          return p;
        }
        function build(text) {
          const bytes = utf8(text), ver = chooseVer(bytes.length), info = VER[ver], size = 17 + ver * 4;
          const bits = []; pushBits(bits, 0b0100, 4); pushBits(bits, bytes.length, 8); for (const b of bytes) pushBits(bits, b, 8);
          const cap = info.tot * 8; pushBits(bits, 0, Math.min(4, cap - bits.length));
          while (bits.length % 8) bits.push(0);
          const pads = [0xEC, 0x11]; let pi = 0; while (bits.length < cap) pushBits(bits, pads[pi++ % 2], 8);
          const dataCw = bits2bytes(bits), ecCw = rsEnc(dataCw, info.ec), all = dataCw.concat(ecCw);
          let best = null, bestPen = Infinity;
          for (let mask = 0; mask < 8; mask++) { const mtx = place(size, ver, all, mask); const pen = penalty(mtx, size); if (pen < bestPen) { bestPen = pen; best = mtx; } }
          return { matrix: best, size };
        }
        function draw(canvas, text, scale, quiet) {
          const { matrix, size } = build(text); scale = scale || 6; quiet = (quiet == null) ? 4 : quiet;
          const dim = (size + quiet * 2) * scale; canvas.width = dim; canvas.height = dim;
          const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, dim, dim); ctx.fillStyle = "#0b0c0c";
          for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (matrix[r][c]) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
        }
        return { build, draw };
      })();

/* dummy public URLs for the generated page */
      const REG_URL = "https://register.example.org/climate-assembly-2024";
      const SHORT_URL = "https://opndlp.org/r/CLMT24";

/* ================================================================== *

      function render() {

      function findField(id){ for(const s of state.sections){ const f=s.fields.find(x=>x.id===id); if(f) return f; } return null; }

          <canvas class="qr" id="qrCanvas" aria-label="QR code for the short registration URL"></canvas>
          <div style="margin:.5rem 0 .2rem"><button class="btn btn-secondary btn-sm" id="qrDownload">⬇ Download QR</button></div>
          <p class="small muted" style="margin:0;max-width:170px">Scan to open on a phone. Add the image to printed invitations.</p>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0;background:transparent;border:0">
      <div class="gov-preview">
        <div class="gp-bar">🔒 ${esc(REG_URL.replace(/^https:\/\//,""))} &nbsp;·&nbsp; public view</div>
        <div class="gov-inner">
          <h1>${esc(state.intro.title)}</h1>
          ${state.intro.body.split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("")}
          <form onsubmit="return false">
            ${state.sections.length===0 ? `<p class="muted">No sections added — go back to stage 4.</p>` : state.sections.map(renderPublicSection).join("")}
            ${state.sections.length ? `<button type="submit" class="gov-submit">Submit registration</button>` : ""}
          </form>
        </div>
      </div>
    </div>`;

        QR.draw($("#qrCanvas"), SHORT_URL, 4, 4);
        $("#qrDownload").onclick = () => {
          const tmp = document.createElement("canvas");
          QR.draw(tmp, SHORT_URL, 12, 4);
          const a = document.createElement("a");
          a.href = tmp.toDataURL("image/png"); a.download = "registration-qr.png"; a.click();
        };
        $("#publishBtn").onclick = () => alert("In the real app this flips the page from TEST to LIVE and the public URL starts accepting registrations. (Illustrative only here.)");
      }

      function renderPublicSection(s) {
        return `<fieldset class="gov-fieldset">
    <legend class="gov-legend">${esc(s.title)}</legend>
    ${s.fields.map(renderPublicField).join("")}
  </fieldset>`;
      }
      function renderPublicField(f) {
        const req = f.required ? ` <span style="color:var(--error-600)">*</span>` : "";
        const hint = f.help ? `<div class="gov-hint">${esc(f.help)}</div>` : "";
        if (f.type === "checkbox")
          return `<div class="gov-field"><label class="gov-opt"><input type="checkbox"> <span>${esc(f.label)}${req}</span></label>${hint}</div>`;
        if (f.type === "radio")
          return `<div class="gov-field"><span class="gov-q">${esc(f.label)}${req}</span>${hint}
      ${(f.options||[]).map(o=>`<label class="gov-opt"><input type="radio" name="${f.id}"> <span>${esc(o)}</span></label>`).join("")}</div>`;
        if (f.type === "select")
          return `<div class="gov-field"><label class="gov-q">${esc(f.label)}${req}</label>${hint}
      <select><option>Please select…</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>`;
  return `<div class="gov-field"><label class="gov-q">${esc(f.label)}${req}</label>${hint}<input type="${f.type==="email"?"email":f.type==="tel"?"tel":"text"}"></div>`;
}

      function goNext() {
        if (state.step === LAST) { state.step = 1; state.targets = []; state.sections = []; editing = null; render(); return; }
        state.step = Math.min(LAST, state.step + 1); render();
      }
      function goBack() { state.step = Math.max(1, state.step - 1); render(); }

      $$(".navnext").forEach(b => b.onclick = goNext);
      $$(".navback").forEach(b => b.onclick = goBack);
      $("#steps").addEventListener("click", e => {
        const b = e.target.closest(".step"); if (!b) return;
        state.step = +b.dataset.step; editing = null; render();
      });

      render();
