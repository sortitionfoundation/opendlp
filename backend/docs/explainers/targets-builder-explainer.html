<!DOCTYPE html>
<!--
ABOUTME: Single-file interactive explainer for building selection targets and the registration fields that feed them.
ABOUTME: Intro → Targets list (with add-target modal, incl. stepped mapping wizards) → read-only registration-form preview. No build step, no framework.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Selection targets setup — workflow explainer</title>
    <style>
  /* Tokens lifted from backoffice design system (primitive + semantic) */
      :root {
        --brand-50:#FBE7EF; --brand-100:#F4B6CB; --brand-200:#E682A4; --brand-300:#C70039;
        --brand-400:#90003F; --brand-600:#720046; --brand-700:#5E003A;
        --n0:#FFFFFF; --n50:#F7F7F8; --n100:#EFEFF1; --n200:#E1E2E5; --n300:#C8CAD0;
        --n400:#9EA2AC; --n500:#6F7482; --n600:#4E5361; --n700:#2F3442; --n800:#1F2330;
        --success-100:#E6F4EA; --success-400:#2E8B57; --success-600:#1F6A42;
        --warning-100:#FFF4E5; --warning-400:#D9822B; --warning-600:#A6631E;
        --info-100:#E8F1FA; --info-400:#3A7BD5; --info-600:#2B5FA6;
        --error-100:#FDEBEC; --error-400:#C70039; --error-600:#90003F;
        --radius:8px;
      }
      * { box-sizing:border-box; }
      html,body { margin:0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background:var(--n50); color:var(--n600); line-height:1.5;
      }
      h1,h2,h3,h4 { color:var(--n700); line-height:1.25; margin:0 0 .5rem; }
      p { margin:0 0 .75rem; }
      a { color:var(--brand-400); }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:.85em; }

  /* ---- top bar ---- */
      .appbar { background:var(--n800); color:var(--n0); padding:.75rem 1.5rem; display:flex; align-items:center; gap:.75rem; }
      .appbar .logo { width:26px;height:26px;border-radius:6px;background:var(--brand-400); display:grid;place-items:center;font-weight:700;font-size:.8rem; }
      .appbar .title { font-weight:600; }
      .appbar .sub { color:var(--n400); font-size:.85rem; margin-left:.25rem; }
      .demo-flag { margin-left:auto; background:var(--warning-100); color:var(--warning-600); border:1px solid var(--warning-400); padding:.15rem .55rem; border-radius:999px; font-size:.72rem; font-weight:600; letter-spacing:.02em; }

  /* ---- tabs ---- */
      .tabs { background:var(--n0); border-bottom:1px solid var(--n200); padding:0 1.5rem; display:flex; gap:.25rem; overflow-x:auto; }
      .tab { appearance:none; background:none; border:none; cursor:pointer; padding:.9rem .9rem; display:flex; align-items:center; gap:.45rem;
        color:var(--n500); font-size:.9rem; font-family:inherit; border-bottom:3px solid transparent; white-space:nowrap; }
      .tab:hover { color:var(--n700); }
      .tab.active { color:var(--brand-400); border-bottom-color:var(--brand-400); font-weight:600; }
      .tab .badge-count { background:var(--brand-50); color:var(--brand-600); border-radius:999px; padding:0 .45rem; font-size:.72rem; font-weight:700; }
      .tabs .restart { margin-left:auto; align-self:center; }

  /* ---- layout ---- */
      .layout { max-width:1280px; margin:0 auto; padding:1rem 1.5rem 2.5rem; display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:1.5rem; align-items:start; }
      @media (max-width: 920px){ .layout { grid-template-columns:1fr; } }
      .layout.solo { grid-template-columns:1fr; max-width:820px; }
      .main { min-width:0; }

      .stage-head h2 { font-size:1.6rem; }
      .stage-head .lede { color:var(--n500); font-size:1.05rem; max-width:64ch; }
      .stage-head .stage-tag { display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--brand-400); margin-bottom:.35rem; }
      .head-row { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; }

  /* ---- cards ---- */
      .card { background:var(--n0); border:1px solid var(--n200); border-radius:var(--radius); padding:1.1rem 1.2rem; margin:1rem 0; }
      .card.highlight { border-color:var(--brand-200); }
      .card h3 { font-size:1.05rem; }
      .muted { color:var(--n500); }
      .small { font-size:.85rem; }

  /* ---- buttons ---- */
      .btn { font-family:inherit; cursor:pointer; border-radius:6px; padding:.5rem .9rem; font-size:.9rem; font-weight:600; border:1px solid transparent; display:inline-flex; align-items:center; gap:.4rem; }
      .btn-primary { background:var(--brand-400); color:#fff; }
      .btn-primary:hover { background:var(--brand-600); }
      .btn-secondary { background:#fff; color:var(--n700); border-color:var(--n700); }
      .btn-secondary:hover { background:var(--n200); }
      .btn-ghost { background:transparent; color:var(--n700); border-color:transparent; }
      .btn-ghost:hover { background:var(--n200); }
      .btn-lg { padding:.65rem 1.15rem; font-size:1rem; }
      .btn-sm { padding:.3rem .65rem; font-size:.82rem; }
      .btn:disabled { opacity:.45; cursor:not-allowed; }
      .iconbtn { background:transparent; border:1px solid var(--n200); border-radius:6px; cursor:pointer; width:1.85rem; height:1.85rem; display:grid; place-items:center; color:var(--n500); font-size:.95rem; flex:0 0 auto; }
      .iconbtn:hover { background:var(--n100); color:var(--n700); }
      .iconbtn.danger:hover { background:var(--error-100); color:var(--error-600); border-color:var(--error-400); }
      .iconbtn:disabled { opacity:.35; cursor:not-allowed; }

  /* ---- pills / chips ---- */
      .chips { display:flex; flex-wrap:wrap; gap:.35rem; }
      .chip { background:var(--n100); border:1px solid var(--n200); color:var(--n600); border-radius:999px; padding:.15rem .55rem; font-size:.8rem; }
      .chip.brand { background:var(--brand-50); border-color:var(--brand-100); color:var(--brand-600); }

  /* row used across lists so things look consistent */
      .field-row { display:flex; align-items:flex-start; gap:.55rem; padding:.6rem .7rem; border:1px solid var(--n200); border-radius:6px; background:var(--n0); margin:.5rem 0; }
      .field-row .fr-body { flex:1; min-width:0; }
      .field-row .fr-label { font-weight:600; color:var(--n700); font-size:.95rem; }
      .field-row .fr-meta { font-size:.8rem; color:var(--n500); margin-top:.15rem; }
      .field-row .fr-actions { display:flex; gap:.3rem; align-items:center; }
      .badge { font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:.05rem .4rem; border-radius:4px; vertical-align:middle; }
      .badge.req { background:var(--error-100); color:var(--error-600); }
      .badge.type { background:var(--n100); color:var(--n500); }
      .badge.target { background:var(--brand-50); color:var(--brand-600); }
      .badge.map { background:var(--info-100); color:var(--info-600); }

      .feeds { margin-top:.45rem; font-size:.8rem; color:var(--n600); background:var(--n50); border:1px dashed var(--n300); border-radius:6px; padding:.4rem .55rem; }
      .feeds .arrow { color:var(--brand-400); font-weight:700; }

  /* ---- inputs ---- */
      label.lbl { font-size:.8rem; font-weight:600; color:var(--n700); display:block; margin-bottom:.2rem; }
      input.txt, textarea.txt, select.txt {
        font-family:inherit; font-size:.9rem; padding:.45rem .55rem; border:1px solid var(--n300); border-radius:6px; width:100%; color:var(--n700); background:#fff;
      }
      textarea.txt { resize:vertical; }
      .field-group { margin:.7rem 0; }
      .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
      @media (max-width:520px){ .grid2 { grid-template-columns:1fr; } }

  /* option list (add / remove rows) */
      .opt-list { display:flex; flex-direction:column; gap:.4rem; margin-top:.3rem; }
      .opt-row { display:flex; gap:.4rem; align-items:center; }
      .opt-row input { flex:1; }

  /* mapping grid */
      .map-grid { display:grid; grid-template-columns:1fr auto 1fr; gap:.4rem .6rem; align-items:center; margin-top:.4rem; }
      .map-grid .mg-from { font-size:.88rem; color:var(--n700); background:var(--n50); border:1px solid var(--n200); border-radius:6px; padding:.4rem .55rem; }
      .map-grid .mg-arrow { color:var(--brand-400); font-weight:700; text-align:center; }

  /* ---- intro choice ---- */
      .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:.5rem; }
      @media (max-width:640px){ .choice-grid { grid-template-columns:1fr; } }
      .choice { text-align:left; background:var(--n0); border:1px solid var(--n200); border-radius:var(--radius); padding:1.1rem 1.2rem; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; gap:.4rem; }
      .choice:hover { border-color:var(--brand-300); box-shadow:0 2px 10px rgba(0,0,0,.06); }
      .choice h3 { margin:0; }
      .choice .ci { font-size:1.5rem; }
      .choice p { margin:0; font-size:.9rem; color:var(--n500); }

  /* ---- sidebar notes ---- */
      .aside { position:sticky; top:1rem; }
      .notebox { background:var(--n0); border:1px solid var(--n200); border-radius:var(--radius); overflow:hidden; }
      .notebox > .nb-head { background:var(--n800); color:#fff; padding:.6rem .85rem; font-weight:600; font-size:.9rem; display:flex; align-items:center; gap:.45rem; }
      .nb-body { padding:.5rem .85rem .9rem; }
      .note { border-left:3px solid var(--n300); padding:.5rem .6rem; margin:.6rem 0; font-size:.85rem; border-radius:0 6px 6px 0; }
      .note h5 { margin:0 0 .2rem; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; }
      .note.live   { background:var(--success-100); border-left-color:var(--success-400); }
      .note.live h5 { color:var(--success-600); }
      .note.future { background:var(--info-100); border-left-color:var(--info-400); }
      .note.future h5 { color:var(--info-600); }
      .note.warn   { background:var(--warning-100); border-left-color:var(--warning-400); }
      .note.warn h5 { color:var(--warning-600); }
      .note p { margin:.15rem 0; }
      .note ul { margin:.2rem 0 0; padding-left:1.1rem; }
      .note li { margin:.15rem 0; }
      details.helper { margin:.5rem 0; }
      details.helper summary { cursor:pointer; color:var(--brand-400); font-size:.85rem; }

  /* ---- read-only public form preview ---- */
      .ro-banner { background:var(--info-100); border:1px solid var(--info-400); color:var(--info-600); border-radius:6px; padding:.5rem .7rem; font-size:.85rem; font-weight:600; margin-bottom:1rem; }
      .gov-preview { background:#fff; border:1px solid var(--n300); border-radius:var(--radius); padding:0; overflow:hidden; }
      .gov-preview .gp-bar { background:var(--n800); color:#fff; padding:.6rem 1.2rem; font-size:.85rem; }
      .gov-inner { padding:1.4rem 1.6rem 2rem; max-width:680px; }
      .gov-inner h1 { font-size:1.7rem; border-bottom:0; }
      .gov-fieldset { border:0; padding:0; margin:0 0 1.6rem; }
      .gov-legend { font-size:1.1rem; font-weight:700; color:var(--n700); border-bottom:2px solid var(--brand-400); padding-bottom:.3rem; margin-bottom:.8rem; }
      .gov-field { margin:0 0 1rem; }
      .gov-field > label, .gov-field > .gov-q { display:block; font-weight:600; color:var(--n700); margin-bottom:.25rem; }
      .gov-hint { color:var(--n500); font-size:.85rem; margin-bottom:.35rem; }
      .gov-field input[type=text], .gov-field select {
        width:100%; padding:.5rem .55rem; border:2px solid var(--n700); border-radius:4px; font-family:inherit; font-size:.95rem; background:#fff;
      }
      .dob-row { display:flex; gap:.6rem; }
      .dob-row > div { display:flex; flex-direction:column; }
      .dob-row .dob-lbl { font-size:.78rem; color:var(--n500); margin-bottom:.15rem; }
      .dob-row input { width:4.5rem; }
      .dob-row input.yr { width:6rem; }
      .gov-opt { display:flex; align-items:center; gap:.5rem; margin:.3rem 0; }
      .ro-form, .ro-form * { pointer-events:none; }
      .ro-form input, .ro-form select { background:var(--n50) !important; color:var(--n500) !important; }
      .feed-tag { font-size:.72rem; color:var(--brand-600); background:var(--brand-50); border:1px solid var(--brand-100); border-radius:4px; padding:.05rem .35rem; margin-left:.4rem; font-weight:600; }

      table.summary { width:100%; border-collapse:collapse; font-size:.88rem; margin-top:.4rem; }
      table.summary th, table.summary td { border:1px solid var(--n200); padding:.45rem .6rem; text-align:left; vertical-align:top; }
      table.summary th { background:var(--n50); color:var(--n700); font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; }

  /* ---- modal ---- */
      .modal-overlay { position:fixed; inset:0; background:rgba(31,35,48,.55); display:grid; place-items:center; padding:1.5rem; z-index:50; }
      .modal { background:var(--n0); border-radius:var(--radius); width:min(640px,100%); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3); }
      .modal-head { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem; border-bottom:1px solid var(--n200); }
      .modal-head h3 { margin:0; font-size:1.15rem; }
      .modal-body { padding:1.1rem 1.2rem; overflow-y:auto; }
      .modal-foot { display:flex; gap:.5rem; justify-content:flex-end; padding:.9rem 1.2rem; border-top:1px solid var(--n200); }
      .modal-foot .spacer { margin-right:auto; }
      .type-desc { background:var(--brand-50); border:1px solid var(--brand-100); color:var(--brand-700); border-radius:6px; padding:.55rem .7rem; font-size:.88rem; margin:.6rem 0 .9rem; }
      .modal-warn { background:var(--warning-100); border:1px solid var(--warning-400); color:var(--warning-600); border-radius:6px; padding:.55rem .7rem; font-size:.85rem; margin:.6rem 0 .9rem; }

  /* stepper */
      .stepper { display:flex; gap:.4rem; align-items:center; margin:.2rem 0 1rem; flex-wrap:wrap; }
      .stepper .st { display:flex; align-items:center; gap:.4rem; font-size:.82rem; color:var(--n500); }
      .stepper .st .dot { width:1.4rem; height:1.4rem; border-radius:50%; background:var(--n200); color:var(--n600); display:grid; place-items:center; font-size:.75rem; font-weight:700; }
      .stepper .st.active { color:var(--brand-400); font-weight:600; }
      .stepper .st.active .dot { background:var(--brand-400); color:#fff; }
      .stepper .st.done .dot { background:var(--success-400); color:#fff; }
      .stepper .sep { color:var(--n300); }

      .example-box { background:var(--n50); border:1px solid var(--n200); border-radius:6px; padding:.55rem .7rem; font-size:.83rem; margin-top:.7rem; }
      .example-box .brackets { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.35rem; }
      .upload-drop { border:2px dashed var(--n300); border-radius:8px; padding:1.2rem; text-align:center; color:var(--n500); font-size:.9rem; margin-top:.4rem; }
      .upload-drop.done { border-color:var(--success-400); background:var(--success-100); color:var(--success-600); }
      .check-row { display:flex; align-items:center; gap:.55rem; padding:.5rem .6rem; border:1px solid var(--n200); border-radius:6px; margin:.35rem 0; cursor:pointer; }
      .check-row:hover { background:var(--n50); }
      .check-row input { width:1.05rem; height:1.05rem; }
      .radio-row { display:flex; align-items:flex-start; gap:.55rem; padding:.55rem .6rem; border:1px solid var(--n200); border-radius:6px; margin:.35rem 0; cursor:pointer; }
      .radio-row:hover { background:var(--n50); }
      .radio-row input { margin-top:.2rem; }
      .radio-row .rr-opts { font-size:.8rem; color:var(--n500); }
      .hidden { display:none !important; }
    </style>
  </head>
  <body>
    <div class="appbar">
      <div class="logo">DL</div>
      <span class="title">OpenDLP</span>
      <span class="sub">Assembly setup — selection targets walkthrough</span>
      <span class="demo-flag">INTERACTIVE EXPLAINER · not the real app</span>
    </div>

    <nav class="tabs" id="tabs"></nav>

    <div class="layout" id="layout">
      <div class="main" id="stage"></div>
      <aside class="aside" id="asideWrap">
        <div class="notebox">
          <div class="nb-head">📋 What's going on here</div>
          <div class="nb-body" id="sidebar"></div>
        </div>
      </aside>
    </div>

    <div id="modalRoot"></div>

    <script>
      "use strict";

/* ================================================================== *
 * Small helpers                                                       *
 * ================================================================== */
      const $  = (sel, root=document) => root.querySelector(sel);
      const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
      const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
      let uid = 1;
      const nid = () => "t" + (uid++);
      const TODAY = "2026-07-13"; // fixed "today" for this explainer

/* ================================================================== *
 * Target model                                                        *
 *   kind: generic | preset | age | small_map | large_map | intersection
 *   values: the target buckets (what selection balances against)
 * ================================================================== */
      const PRESETS = {
        gender:     { name: "gender",     options: ["Male", "Female", "Non-binary or other"] },
        disability: { name: "disability", options: ["Yes", "No"] },
      };

      function computeBrackets(minAge, maxAge, boundariesStr) {
        const bounds = String(boundariesStr).split(",").map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n)).sort((a,b)=>a-b);
        const edges = [parseInt(minAge,10), ...bounds];
        const out = [];
        for (let i = 0; i < edges.length; i++) {
          const lo = edges[i];
          const hi = (i + 1 < edges.length) ? edges[i+1] - 1 : parseInt(maxAge,10) - 1;
          if (isNaN(lo) || isNaN(hi) || hi < lo) continue;
          out.push(`${lo}-${hi}`);
        }
        return out;
      }

/* Ready-made "common targets" used when the user picks that starting point. */
      function commonTargets() {
        return [
          { id: nid(), kind: "generic", name: "gender", values: PRESETS.gender.options.slice() },
          { id: nid(), kind: "age", name: "age_bracket", asOf: TODAY, minAge: 16, maxAge: 100, boundaries: "30,45,60",
            values: computeBrackets(16, 100, "30,45,60") },
          { id: nid(), kind: "generic", name: "education_level",
            values: ["No qualifications", "Level 1–2", "Level 3", "Level 4+"] },
          { id: nid(), kind: "large_map", name: "region", regFieldName: "postcode",
            values: ["North", "Midlands", "South", "London"] },
        ];
      }

      const state = {
        page: "intro",          // intro | targets | regform
        started: false,
        targets: [],
      };

/* ================================================================== *
 * Derive the registration fields the targets need (deduped)           *
 * ================================================================== */
      function deriveRegFields() {
        const fields = [];
        const byKey = {};
        const add = (key, f) => {
          if (byKey[key]) { byKey[key].feeds.push(...f.feeds); return; }
          byKey[key] = f; fields.push(f);
        };
        for (const t of state.targets) {
          if (t.kind === "generic") {
            add("f:" + t.name.toLowerCase(), {
              label: t.name, type: t.values.length > 6 ? "select" : "radio",
              options: t.values.slice(), feeds: [{ target: t.name, how: "used directly" }],
            });
          } else if (t.kind === "age") {
            add("dob", {
              label: "Date of birth", type: "dob",
              feeds: [{ target: t.name, how: "age calculated on " + t.asOf + ", then bucketed" }],
            });
          } else if (t.kind === "small_map") {
            add("f:" + t.name.toLowerCase() + ":detail", {
              label: t.regLabel || t.name, type: "select", options: (t.regValues || []).slice(),
              feeds: [{ target: t.name, how: "each option mapped to a target value" }],
            });
          } else if (t.kind === "large_map") {
            add("f:" + (t.regFieldName || "postcode").toLowerCase(), {
              label: t.regFieldName || "postcode", type: "text",
              feeds: [{ target: t.name, how: "looked up in the uploaded table" }],
            });
          }
    /* intersection adds no new field — it reuses its components' fields */
        }
        return fields;
      }

/* ================================================================== *
 * RENDER                                                              *
 * ================================================================== */
      function render() {
        renderTabs();
        const stage = $("#stage");
        ({ intro: pageIntro, targets: pageTargets, regform: pageRegform }[state.page])(stage);
        renderSidebar();
  // Intro is presented full-width without the notes sidebar.
        $("#layout").classList.toggle("solo", state.page === "intro");
        $("#asideWrap").classList.toggle("hidden", state.page === "intro");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderTabs() {
        if (!state.started) { $("#tabs").innerHTML = ""; return; }
        const tab = (key, label, count) =>
        `<button class="tab ${state.page===key?"active":""}" data-tab="${key}">${esc(label)}${
      count!=null ? ` <span class="badge-count">${count}</span>` : ""}</button>`;
  $("#tabs").innerHTML =
    tab("targets", "Targets", state.targets.length) +
    tab("regform", "Registration form") +
    `<button class="btn btn-ghost btn-sm restart" data-tab="intro">↺ Start over</button>`;
  $$("#tabs [data-tab]").forEach(b => b.onclick = () => {
    if (b.dataset.tab === "intro") { state.started = false; state.targets = []; state.page = "intro"; }
    else state.page = b.dataset.tab;
    render();
  });
}

/* ---------------------------- Intro ------------------------------- */
function pageIntro(m) {
  m.innerHTML = `
        <div class="stage-head">
        <span class="stage-tag">Setup · Targets tab</span>
        <h2>Set up your selection targets</h2>
        <p class="lede">A <strong>target</strong> is a characteristic you balance the assembly against — gender, age,
        region, and so on — each with a set of values. Every target needs data from the registration form to fill it,
        so as you build targets here you're also deciding what the registration page must ask.</p>
    </div>
    <div class="card">
      <h3>How would you like to start?</h3>
      <p class="muted small">Either way you can add, edit and remove targets afterwards — so pick whichever, then try
      adding your own.</p>
      <div class="choice-grid">
        <button class="choice" id="startCommon">
          <span class="ci">📦</span>
          <h3>Start with common targets</h3>
          <p>Drops in a ready-made set — gender, age bracket, education level and region — that you can tweak or delete.</p>
        </button>
        <button class="choice" id="startBlank">
          <span class="ci">🗒️</span>
          <h3>Start with a blank slate</h3>
          <p>An empty targets list. You'll add every target yourself, one at a time.</p>
        </button>
        </div>
        </div>`;
  $("#startCommon").onclick = () => { state.targets = commonTargets(); begin(); };
  $("#startBlank").onclick  = () => { state.targets = []; begin(); };
}
function begin() { state.started = true; state.page = "targets"; render(); }

/* ---------------------------- Targets page ------------------------ */
const KIND_LABEL = {
  generic: "generic", age: "age bracket",
  small_map: "small mapping", large_map: "large mapping", intersection: "intersection",
};

function feedsSummary(t) {
  if (t.kind === "generic")
    return `Registration field <strong>${esc(t.name)}</strong> <span class="arrow">→</span> same options, used directly.`;
  if (t.kind === "age")
    return `Registration collects <strong>date of birth</strong> <span class="arrow">→</span> age on ${esc(t.asOf)} <span class="arrow">→</span> bracket.`;
  if (t.kind === "small_map")
    return `Registration field with ${t.regValues ? t.regValues.length : "several"} options <span class="arrow">→</span> mapped down to ${t.values.length} target values.`;
  if (t.kind === "large_map")
    return `Registration field <strong>${esc(t.regFieldName || "postcode")}</strong> <span class="arrow">→</span> lookup table <span class="arrow">→</span> ${t.values.length} target values.`;
  if (t.kind === "intersection")
    return `Derived from the intersection of ${esc((t.parents||[]).join(" & "))} — no new registration field.`;
  return "";
}

function pageTargets(m) {

        <div class="stage-head">

        <span class="stage-tag">Targets tab</span>

        <p class="lede">The characteristics you'll balance the assembly against. Each shows the registration data

        </div>

      </div>
    </div>

    <div class="card ${state.targets.length ? "" : "highlight"}">
      <h3>Target categories <span class="chip brand">${state.targets.length}</span></h3>
      ${state.targets.length === 0
        ? `<p class="muted small">No targets yet. Click <strong>＋ Add target</strong> to create your first one.</p>`
        : state.targets.map(t => `
          <div class="field-row">
            <span class="fr-body">
              <span class="fr-label">${esc(t.name)}</span>
              <span class="badge ${t.kind==="intersection"||t.kind==="small_map"||t.kind==="large_map"?"map":"type"}">${esc(KIND_LABEL[t.kind])}</span>

/* ---------------------------- Registration form (read-only) ------- */
function pageRegform(m) {
  const fields = deriveRegFields();

    </div>

}

function renderRoField(f) {
  const feeds = f.feeds.map(fd => `<span class="feed-tag">feeds: ${esc(fd.target)}</span>`).join("");
  if (f.type === "dob")
    return `<div class="gov-field"><span class="gov-q">Date of birth ${feeds}</span>
      <div class="dob-row">
      <div><span class="dob-lbl">Day</span><input type="text" value="" disabled></div>
      <div><span class="dob-lbl">Month</span><input type="text" value="" disabled></div>
      <div><span class="dob-lbl">Year</span><input type="text" class="yr" value="" disabled></div>
      </div></div>`;
  if (f.type === "radio")
    return `<div class="gov-field"><span class="gov-q">${esc(f.label)} ${feeds}</span>
      ${(f.options||[]).map(o=>`<label class="gov-opt"><input type="radio" disabled> <span>${esc(o)}</span></label>`).join("")}</div>`;
  if (f.type === "select")
    return `<div class="gov-field"><label class="gov-q">${esc(f.label)} ${feeds}</label>
      <select disabled><option>Please select…</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>`;
      return `<div class="gov-field"><label class="gov-q">${esc(f.label)} ${feeds}</label><input type="text" disabled></div>`;
      }

/* ================================================================== *
 * ADD-TARGET MODAL                                                    *
 * ================================================================== */
      const modal = { open: false, type: "", step: 0, draft: {}, editId: null };

      const TYPES = [
        { key: "generic",      label: "Generic",                    steps: 1 },
        { key: "preset",       label: "Common preset generic",      steps: 1 },
        { key: "age",          label: "Age bracket",                steps: 1 },
        { key: "small_map",    label: "Small mapping",              steps: 3 },
        { key: "large_map",    label: "Large mapping",              steps: 3 },
        { key: "intersection", label: "Intersection of two targets",steps: 1 },
        { key: "copy",         label: "Copy from another assembly", steps: 1 },
      ];
      const TYPE_DESC = {
        generic:      "A target with a set of options you type in. The registration form offers exactly the same options, and the answer is used directly.",
        preset:       "A shortcut to create a generic target with ready-made options, so you don't have to type common ones. It's added as a generic target you can edit afterwards. Pick one below.",
        age:          "Registrants enter their date of birth. The system works out their age on a chosen date and drops them into an age bracket.",
        small_map:    "The registration form offers many options but you want fewer target values. Map each registration option onto a target value. Example: 10 ethnicity options → 4 target buckets.",
        large_map:    "The registration form has a free-text field (e.g. postcode) that you convert to a small set of target values using a lookup table you upload. Example: postcode → region.",
        intersection: "A target built from the combination of two existing targets, e.g. male-disabled, female-disabled, male-non-disabled, female-non-disabled.",
        copy:         "Copy a target from another assembly you have access to.",
      };
      const STEP_LABELS = {
        small_map: ["Target values", "Registration values", "Map them"],
        large_map: ["Target values", "Registration field", "Upload table"],
      };

      function defaultDraft(type) {
        switch (type) {
          case "generic":      return { name: "", options: [""] };
          case "preset":       return { presetKey: "", name: "" };
          case "age":          return { name: "age_bracket", asOf: TODAY, minAge: "16", maxAge: "100", boundaries: "30,45,60" };
          case "small_map":    return { name: "", targetValues: [""], regValues: [""], map: {} };
          case "large_map":    return { name: "", targetValues: [""], regFieldName: "postcode", uploaded: false };
          case "intersection": return { name: "", picked: [] };
          case "copy":         return {};
          default:             return {};
        }
      }

      function openModal() { modal.open = true; modal.editId = null; modal.type = ""; modal.step = 0; modal.draft = {}; renderModal(); }
      function closeModal() { modal.open = false; renderModal(); }

/* Reopen the modal seeded from an existing target (the reverse of commitTarget). */
      function openEdit(id) {
        const t = state.targets.find(x => x.id === id);
        if (!t) return;
        modal.open = true; modal.editId = id; modal.type = t.kind; modal.step = 0; modal.draft = draftFromTarget(t);
        renderModal();
      }

      function draftFromTarget(t) {
        switch (t.kind) {
          case "generic":      return { name: t.name, options: t.values.slice() };
          case "age":          return { name: t.name, asOf: t.asOf, minAge: String(t.minAge), maxAge: String(t.maxAge), boundaries: t.boundaries };
          case "small_map":    return { name: t.name, targetValues: t.values.slice(), regValues: (t.regValues || []).slice(), map: { ...(t.map || {}) } };
          case "large_map":    return { name: t.name, targetValues: t.values.slice(), regFieldName: t.regFieldName, uploaded: true };
          case "intersection": return { name: t.name, picked: (t.parentIds || []).slice() };
          default:             return defaultDraft(t.kind);
        }
      }

      function renderModal() {
        const root = $("#modalRoot");
        if (!modal.open) { root.innerHTML = ""; return; }
        const t = TYPES.find(x => x.key === modal.type);
        root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${modal.editId ? "Edit target" : "Add a target"}">
        <div class="modal-head">
          <h3>${modal.editId ? "Edit target" : "Add a target"}</h3>
          <button class="iconbtn" id="mClose" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <label class="lbl">Kind of target</label>
            <select class="txt" id="mType" ${modal.editId ? "disabled" : ""}>
              <option value="" ${modal.type===""?"selected":""}>Choose…</option>
              ${TYPES.map(x=>`<option value="${x.key}" ${modal.type===x.key?"selected":""}>${esc(x.label)}</option>`).join("")}
            </select>
            ${modal.editId ? `<p class="small muted" style="margin:.3rem 0 0">A target's kind can't be changed once created.</p>` : ""}
          </div>
          ${modal.type ? `<div class="type-desc">${esc(TYPE_DESC[modal.type])}</div>` : ""}
          ${modal.type && t.steps > 1 ? stepperHTML(modal.type, modal.step) : ""}
          <div id="mForm">${modal.type ? formHTML(modal.type, modal.step) : `<p class="muted small">Pick a kind of target to get started.</p>`}</div>
        </div>
        <div class="modal-foot">${footHTML(t)}</div>
        </div>
        </div>`;

  $("#mClose").onclick = closeModal;
  $("#overlay").onclick = (e) => { if (e.target.id === "overlay") closeModal(); };
  $("#mType").onchange = (e) => {
    modal.type = e.target.value; modal.step = 0; modal.draft = defaultDraft(modal.type); renderModal();
  };
  wireForm(modal.type, modal.step);
  wireFoot(t);
}

function stepperHTML(type, step) {
  const labels = STEP_LABELS[type] || [];
  return `<div class="stepper">${labels.map((l,i)=>`
    ${i>0?`<span class="sep">›</span>`:""}
    <span class="st ${i===step?"active":i<step?"done":""}"><span class="dot">${i<step?"✓":i+1}</span>${esc(l)}</span>`).join("")}</div>`;
}

function footHTML(t) {
  if (!t) return `<button class="btn btn-ghost" data-cancel>Cancel</button>`;
  if (t.key === "copy") return `<button class="btn btn-secondary" data-cancel>Close</button>`;
  const parts = [`<button class="btn btn-ghost spacer" data-cancel>Cancel</button>`];
  if (t.steps > 1 && modal.step > 0) parts.push(`<button class="btn btn-secondary" data-back>← Back</button>`);
  if (t.steps > 1 && modal.step < t.steps - 1) parts.push(`<button class="btn btn-primary" data-next>Next →</button>`);
  else parts.push(`<button class="btn btn-primary" data-add>${modal.editId ? "Save changes" : "Add target"}</button>`);
  return parts.join("");
}

/* ---- name field (always first, where the type has a form) -------- */
function nameFieldHTML(value, placeholder) {
  return `<div class="field-group"><label class="lbl">Target name</label>
        <input class="txt" id="mName" value="${esc(value||"")}" placeholder="${esc(placeholder||"e.g. gender")}"></div>`;
}

/* ---- reusable option list ---------------------------------------- */
function optionListHTML(items, attr, placeholder, addLabel) {
  const list = items.length ? items : [""];
  const rows = list.map((v,i)=>`
        <div class="opt-row">
        <input class="txt" data-opt="${attr}" data-i="${i}" value="${esc(v)}" placeholder="${esc(placeholder)}">
        <button type="button" class="iconbtn danger" data-optdel="${attr}" data-i="${i}" aria-label="Remove" ${list.length<=1?"disabled":""}>✕</button>
        </div>`).join("");
  return `<div class="opt-list">${rows}
        <div><button type="button" class="btn btn-secondary btn-sm" data-optadd="${attr}">＋ ${esc(addLabel||"Add option")}</button></div>
        </div>`;
}

/* ---- per-type form HTML ------------------------------------------ */
function formHTML(type, step) {
  const d = modal.draft;
  if (type === "generic")
    return nameFieldHTML(d.name, "e.g. gender") +
      `<div class="field-group"><label class="lbl">Options</label>
        <p class="muted small" style="margin:.1rem 0 .3rem">The registration form will offer exactly these options.</p>
        ${optionListHTML(d.options, "gopts", "e.g. Male", "Add option")}</div>`;

  if (type === "preset")
    return nameFieldHTML(d.name, "picked automatically below") +
      `<div class="field-group"><label class="lbl">Choose a preset</label>
        ${Object.entries(PRESETS).map(([k,v])=>`
          <label class="radio-row">
            <input type="radio" name="preset" value="${k}" data-preset ${d.presetKey===k?"checked":""}>
            <span><strong>${esc(v.name)}</strong><div class="rr-opts">${v.options.map(esc).join(" · ")}</div></span>
          </label>`).join("")}</div>`;

  if (type === "age") {
    const brackets = computeBrackets(d.minAge, d.maxAge, d.boundaries);
    return nameFieldHTML(d.name, "e.g. age_bracket") +
      `<div class="field-group"><label class="lbl">Date to calculate age on</label>
        <input class="txt" type="date" id="mAsOf" value="${esc(d.asOf)}"></div>
        <div class="grid2">
        <div class="field-group"><label class="lbl">Minimum age</label><input class="txt" type="number" id="mMin" value="${esc(d.minAge)}"></div>
        <div class="field-group"><label class="lbl">Maximum age</label><input class="txt" type="number" id="mMax" value="${esc(d.maxAge)}"></div>
        </div>
        <div class="field-group"><label class="lbl">Age boundaries (comma separated)</label>
        <input class="txt" id="mBounds" value="${esc(d.boundaries)}" placeholder="e.g. 22, 30, 55"></div>
        <div class="example-box">
        <strong>Preview.</strong> Min ${esc(d.minAge)}, max ${esc(d.maxAge)}, boundaries ${esc(d.boundaries||"—")} gives:
          <div class="brackets" id="ageBrackets">${brackets.map(b=>`<span class="chip brand">${esc(b)}</span>`).join("") || `<span class="muted small">enter values above</span>`}</div>
        </div>`;
  }

  if (type === "small_map") {
    if (step === 0)
      return nameFieldHTML(d.name, "e.g. ethnicity_bucket") +
        `<div class="field-group"><label class="lbl">Target values</label>
        <p class="muted small" style="margin:.1rem 0 .3rem">The small set of values used for selection.</p>
        ${optionListHTML(d.targetValues, "tvals", "e.g. White", "Add target value")}</div>`;
    if (step === 1)
      return `<div class="field-group"><label class="lbl">Registration values</label>
        <p class="muted small" style="margin:.1rem 0 .3rem">The full set of options shown on the registration form (usually more).</p>
        ${optionListHTML(d.regValues, "rvals", "e.g. White British", "Add registration value")}</div>`;
    // step 2: map each reg value to a target value
    const tvals = (d.targetValues||[]).map(s=>s.trim()).filter(Boolean);
    const rvals = (d.regValues||[]).map(s=>s.trim()).filter(Boolean);
    return `<div class="field-group"><label class="lbl">Map each registration value to a target value</label>
        <div class="map-grid">
        ${rvals.map((rv,i)=>`
          <div class="mg-from">${esc(rv)}</div>
          <div class="mg-arrow">→</div>
          <select class="txt" data-map="${i}">
            <option value="">Choose target value…</option>
            ${tvals.map(tv=>`<option ${d.map[rv]===tv?"selected":""}>${esc(tv)}</option>`).join("")}
          </select>`).join("")}
        </div>
        ${rvals.length===0?`<p class="muted small">Go back and add some registration values first.</p>`:""}</div>`;
  }

  if (type === "large_map") {
    if (step === 0)
      return nameFieldHTML(d.name, "e.g. region") +
        `<div class="field-group"><label class="lbl">Target values</label>
        <p class="muted small" style="margin:.1rem 0 .3rem">The small set of values you want, e.g. the regions.</p>
        ${optionListHTML(d.targetValues, "tvals", "e.g. North", "Add target value")}</div>`;
    if (step === 1)
      return `<div class="field-group"><label class="lbl">Registration form field this is based on</label>
        <p class="muted small" style="margin:.1rem 0 .3rem">A free-text field on the registration form.</p>
        <input class="txt" id="mRegField" value="${esc(d.regFieldName)}" placeholder="postcode"></div>`;
    // step 2: upload
    const fld = esc(d.regFieldName || "postcode");
    const tgt = esc(d.name || "region");
    return `<div class="field-group"><label class="lbl">Upload the lookup table (CSV)</label>

        giving the ${tgt} it belongs to. Can be thousands of rows.</p>
        <div class="upload-drop ${d.uploaded?"done":""}" id="uploadDrop">
        ${d.uploaded
            ? `✓ <strong>${fld}-to-${tgt}.csv</strong> attached (illustrative — nothing is really uploaded)`

  }

  if (type === "intersection") {
    const picked = d.picked || [];
    const cands = state.targets.filter(t => t.id !== modal.editId);
    return `<div class="modal-warn">⚠ This makes selection <strong>less flexible</strong> — we generally do not recommend it.

            : cands.map(t=>`
            <label class="check-row">
              <input type="checkbox" data-inter="${t.id}" ${picked.includes(t.id)?"checked":""}
                ${(!picked.includes(t.id) && picked.length>=2)?"disabled":""}>
              <span><strong>${esc(t.name)}</strong> <span class="muted small">(${t.values.map(esc).join(" · ")})</span></span>
            </label>`).join("")}

        <p style="margin:0"><strong>Not implemented in this UI proof of concept.</strong></p>
        <p class="muted small" style="margin:.3rem 0 0">In the real app this would let you open another assembly you have
        access to and copy one of its targets across.</p>
        </div>`;

  return "";
}

/* ---- read current inputs back into the draft (so nothing is lost on rerender) ---- */
function syncDraft(type, step) {
  const d = modal.draft;
  const root = $("#mForm");
  if (!root) return;
  const nameEl = $("#mName", root);
  if (nameEl) d.name = nameEl.value;

  const readList = (attr) => $$(`[data-opt="${attr}"]`, root)
    .sort((a,b)=>(+a.dataset.i)-(+b.dataset.i)).map(el => el.value);

  if (type === "generic") d.options = readList("gopts");
  if (type === "age") {
    const asOf = $("#mAsOf", root), mn = $("#mMin", root), mx = $("#mMax", root), bd = $("#mBounds", root);
    if (asOf) d.asOf = asOf.value; if (mn) d.minAge = mn.value; if (mx) d.maxAge = mx.value; if (bd) d.boundaries = bd.value;
  }
  if (type === "small_map") {
    if (step === 0) d.targetValues = readList("tvals");
    if (step === 1) d.regValues = readList("rvals");
    if (step === 2) {
      const rvals = (d.regValues||[]).map(s=>s.trim()).filter(Boolean);
      $$("[data-map]", root).forEach(sel => { const rv = rvals[+sel.dataset.map]; if (rv!=null) d.map[rv] = sel.value; });
    }
  }
  if (type === "large_map") {
    if (step === 0) d.targetValues = readList("tvals");
    if (step === 1) { const rf = $("#mRegField", root); if (rf) d.regFieldName = rf.value; }
  }
}

/* ---- wire up the form's interactive bits ------------------------- */
function wireForm(type, step) {
  const root = $("#mForm");
  if (!root) return;

  // option list add / remove (generic, small_map, large_map)
  $$("[data-optadd]", root).forEach(b => b.onclick = () => {
    syncDraft(type, step);
    listFor(type, step, b.dataset.optadd).push("");
    renderModal();
  });
  $$("[data-optdel]", root).forEach(b => b.onclick = () => {
    syncDraft(type, step);
    const arr = listFor(type, step, b.dataset.optdel);
    arr.splice(+b.dataset.i, 1);
    if (arr.length === 0) arr.push("");
    renderModal();
  });

  // preset radios: selecting fills the name
  $$("[data-preset]", root).forEach(r => r.onchange = () => {
    modal.draft.presetKey = r.value;
    modal.draft.name = PRESETS[r.value].name;
    renderModal();
  });

  // age live preview
  ["mAsOf","mMin","mMax","mBounds"].forEach(id => {
    const el = $("#"+id, root);
    if (el) el.oninput = () => {
      syncDraft(type, step);
      const b = computeBrackets(modal.draft.minAge, modal.draft.maxAge, modal.draft.boundaries);
      const box = $("#ageBrackets", root);
      if (box) box.innerHTML = b.map(x=>`<span class="chip brand">${esc(x)}</span>`).join("") || `<span class="muted small">enter values above</span>`;
    };
  });

  // large_map "upload"
  const drop = $("#uploadDrop", root);
  if (drop) drop.onclick = () => { modal.draft.uploaded = true; renderModal(); };

  // intersection checkboxes: keep a live name and enforce max two
  $$("[data-inter]", root).forEach(c => c.onchange = () => {
    const id = c.dataset.inter;
    const picked = modal.draft.picked;
    if (c.checked) { if (!picked.includes(id)) picked.push(id); }
    else { modal.draft.picked = picked.filter(x => x !== id); }
    const names = modal.draft.picked.map(pid => (state.targets.find(t=>t.id===pid)||{}).name).filter(Boolean);
    modal.draft.name = names.join(" × ");
    renderModal();
  });
}

function listFor(type, step, attr) {
  const d = modal.draft;
  if (attr === "gopts") return d.options;
  if (attr === "tvals") return d.targetValues;
  if (attr === "rvals") return d.regValues;
  return [];
}

/* ---- foot buttons ------------------------------------------------ */
function wireFoot(t) {
  const foot = $(".modal-foot");
  if (!foot) return;
  const cancel = $("[data-cancel]", foot); if (cancel) cancel.onclick = closeModal;
  const back = $("[data-back]", foot); if (back) back.onclick = () => { syncDraft(modal.type, modal.step); modal.step--; renderModal(); };
  const next = $("[data-next]", foot); if (next) next.onclick = () => {
    syncDraft(modal.type, modal.step);
    if (!validateStep(modal.type, modal.step)) return;
    modal.step++; renderModal();
  };
  const add = $("[data-add]", foot); if (add) add.onclick = commitTarget;
}

function validateStep(type, step) {
  const d = modal.draft;
  if (step === 0 && (type === "small_map" || type === "large_map")) {
    if (!(d.name||"").trim()) { alert("Give the target a name."); return false; }
    const tv = (d.targetValues||[]).map(s=>s.trim()).filter(Boolean);
    if (tv.length < 2) { alert("Enter at least two target values."); return false; }
  }
  if (type === "small_map" && step === 1) {
    const rv = (d.regValues||[]).map(s=>s.trim()).filter(Boolean);
    if (rv.length < 1) { alert("Enter at least one registration value."); return false; }
  }
  if (type === "large_map" && step === 1) {
    if (!(d.regFieldName||"").trim()) { alert("Name the registration field (e.g. postcode)."); return false; }
  }
  return true;
}

/* ---- commit the finished target ---------------------------------- */
/* Add a new target, or (when editing) replace the existing one in place,
   keeping its id and its position in the list. */
function saveTarget(obj) {
  if (modal.editId) {
    obj.id = modal.editId;
    const i = state.targets.findIndex(t => t.id === modal.editId);
    if (i >= 0) state.targets[i] = obj; else state.targets.push(obj);
  } else {
    obj.id = nid();
    state.targets.push(obj);
  }
}

function commitTarget() {
  syncDraft(modal.type, modal.step);
  const d = modal.draft;
  const type = modal.type;
  const name = (d.name||"").trim();

  if (type === "generic") {
    const opts = (d.options||[]).map(s=>s.trim()).filter(Boolean);
    if (!name || opts.length < 2) return alert("Give the target a name and at least two options.");
    saveTarget({ kind: "generic", name, values: opts });
  }
  else if (type === "preset") {
    // A preset is just a convenient way to create a generic target with ready-made
    // options — it's stored as "generic" so it can be freely edited afterwards.
    if (!d.presetKey) return alert("Choose a preset.");
    const p = PRESETS[d.presetKey];
    saveTarget({ kind: "generic", name: (name||p.name), values: p.options.slice() });
  }
  else if (type === "age") {
    const brackets = computeBrackets(d.minAge, d.maxAge, d.boundaries);
    if (!name || brackets.length < 2) return alert("Give the target a name and enough boundaries for at least two brackets.");
    saveTarget({ kind: "age", name, asOf: d.asOf, minAge: d.minAge, maxAge: d.maxAge, boundaries: d.boundaries, values: brackets });
  }
  else if (type === "small_map") {
    const tv = (d.targetValues||[]).map(s=>s.trim()).filter(Boolean);
    const rv = (d.regValues||[]).map(s=>s.trim()).filter(Boolean);
    if (!name || tv.length < 2 || rv.length < 1) return alert("Complete the earlier steps first.");
    saveTarget({ kind: "small_map", name, values: tv, regValues: rv, regLabel: name, map: { ...d.map } });
  }
  else if (type === "large_map") {
    const tv = (d.targetValues||[]).map(s=>s.trim()).filter(Boolean);
    if (!name || tv.length < 2) return alert("Complete the earlier steps first.");
    saveTarget({ kind: "large_map", name, values: tv, regFieldName: (d.regFieldName||"postcode").trim() });
  }
  else if (type === "intersection") {
    const parents = (d.picked||[]).map(id => state.targets.find(t => t.id === id)).filter(Boolean);
    if (parents.length !== 2) return alert("Pick exactly two targets to combine.");
    const [a, b] = parents;
    const combined = a.values.flatMap(av => b.values.map(bv => `${av} + ${bv}`));
    saveTarget({ kind: "intersection", name: (name || `${a.name} × ${b.name}`),
      values: combined, parents: [a.name, b.name], parentIds: [a.id, b.id] });
  }

  closeModal();
  render();
}
