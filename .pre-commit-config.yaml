repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        exclude: ^.devcontainer/devcontainer.json
      - id: detect-private-key
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # TODO: consider
  # - csslint

  # Python linting and formatting. Like the eslint/prettier hooks below, these
  # run the tool from the project rather than installing an isolated copy, so
  # the ruff version is the one pinned in backend/pyproject.toml + uv.lock -
  # `just install`, CI's `uv sync --frozen` and the Dockerfile all provide it.
  # That keeps a direct `uv run ruff` on the command line and the hook on
  # exactly the same version; an isolated `rev:` pin drifts from uv.lock,
  # because dependabot watches the uv ecosystem but not pre-commit.
  # `python -m ruff` rather than plain `ruff`: `uv run ruff` silently falls back
  # to a ruff on $PATH when the venv lacks it, which is the drift we're closing.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        entry: uv run --project backend python -m ruff check --force-exclude --exit-non-zero-on-fix --fix --config=backend/pyproject.toml
      - id: ruff-format
        name: ruff format (backend)
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        entry: uv run --project backend python -m ruff format --force-exclude --config=backend/pyproject.toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rtts/djhtml
    rev: "3.0.11"
    hooks:
      - id: djhtml
      - id: djcss
      # djhtml already indents inline <script> blocks inside templates, so this
      # only covers a standalone .js file under templates/ - there are none
      # today. Standalone .js belongs to prettier (see the local hooks below).
      - id: djjs
        files: ^backend/templates/

  # check for secrets, ssh keys etc
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '(package\.lock\.json|migrations/versions/.*\.py)'

  # look for typos
  - repo: https://github.com/crate-ci/typos
    rev: "v1.49.0"
    hooks:
      - id: typos
        # no `-w` disable the auto fix, always review the output
        # `-c` is to tell it where the config is
        # `--force-exclude` is because the pre-commit stuff explicitly passes every
        #    filename to typos as an argument. Without --force-exclude typos will
        #    check all the files, even though they are in the exclude.
        #    See https://github.com/crate-ci/typos/issues/347 for details.
        args: ["--force-exclude", "-c", "backend/pyproject.toml"]

  # Forbid .strftime() in Jinja templates - use flask-babel's
  # dateformat/datetimeformat/timeformat filters instead so month names,
  # date ordering and timezone handling respect the active locale.
  - repo: local
    hooks:
      - id: no-strftime-in-templates
        name: No .strftime() in Jinja templates (use babel filters)
        language: pygrep
        files: ^backend/templates/.*\.html$
        entry: '\.strftime\s*\('

  # JavaScript linting and formatting. These run the npm scripts rather than
  # installing their own copies, so the eslint/prettier versions are the ones
  # pinned in backend/package.json - node_modules/ is already present from
  # `just install`, CI's `npm install` and the Dockerfile. Both lint the whole
  # tree rather than the passed filenames, which is why pass_filenames is false.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (backend JavaScript)
        language: system
        files: ^backend/.*\.(js|mjs)$
        pass_filenames: false
        entry: npm --prefix backend run lint
      - id: prettier
        name: prettier (backend JavaScript)
        language: system
        files: ^backend/.*\.(js|mjs)$
        pass_filenames: false
        entry: npm --prefix backend run format
