name: "Setup Environment"
description: >
  Install the toolchains and dependencies a job needs, and build the artefacts
  that are gitignored and so absent from a fresh checkout: the frontend bundles
  and the compiled translation catalogues. A job that runs the app - the test
  suites, the BDD browser run - needs all of it, so it lives here rather than
  in each workflow, where it can be forgotten one workflow at a time.

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.14"
  node-version:
    description: "Nodejs version to use"
    required: true
    default: "22"
  uv-version:
    # Keep in step with the uv image pinned in backend/Dockerfile, which
    # Dependabot bumps - it cannot bump this one.
    description: "uv version to use"
    required: true
    default: "0.12.24"
  working-directory:
    description: "the working directory for uv commands"
    required: false
    default: "./"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: "true"
        # inputs, not matrix: the matrix context is not available inside a
        # composite action, so a matrix reference here evaluates to empty.
        cache-suffix: ${{ inputs.python-version }}

    - name: Install Python dependencies
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen
      shell: bash
      env:
        # Without this, uv obeys .python-version (the local dev pin) and quietly
        # installs that version whatever python-version the caller asked for.
        UV_PYTHON: ${{ inputs.python-version }}

    - name: Install Node.js dependencies and build frontend assets
      working-directory: ${{ inputs.working-directory }}
      # `npm ci` is the Node counterpart of `uv sync --frozen` above - it installs
      # exactly what package-lock.json pins, and fails if the lock file has drifted
      # out of sync with package.json.
      run: |
        npm ci
        npm run build
      shell: bash

    - name: Compile translation catalogues
      working-directory: ${{ inputs.working-directory }}
      # The .mo files are gitignored, exactly like the frontend bundles built
      # above, and are needed for the same reason: without them every gettext
      # lookup falls back to its msgid and the app is silently monolingual
      # English. That is not a hypothetical - CI ran without catalogues for as
      # long as no test asserted a translated string. The Dockerfile compiles
      # them into the image; this is the same step for a job that runs from a
      # checkout. Costs about a second.
      run: uv run pybabel compile --directory=translations
      shell: bash
