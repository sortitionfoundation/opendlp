name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  node-version:
    description: "Nodejs version to use"
    required: true
    default: "22"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.9.17"
  working-directory:
    description: "the working directory for uv commands"
    required: false
    default: "./"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: "true"
        # inputs, not matrix: the matrix context is not available inside a
        # composite action, so the old ${{ matrix.python-version }} was empty.
        cache-suffix: ${{ inputs.python-version }}

    - name: Install Python dependencies
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen
      shell: bash
      env:
        # Without this, uv obeys .python-version (the local dev pin) and quietly
        # installs 3.12 whatever python-version the caller asked for.
        UV_PYTHON: ${{ inputs.python-version }}

    - name: Install Node.js dependencies and build frontend assets
      working-directory: ${{ inputs.working-directory }}
      # `npm ci` is the Node counterpart of `uv sync --frozen` above - it installs
      # exactly what package-lock.json pins, and fails if the lock file has drifted
      # out of sync with package.json.
      run: |
        npm ci
        npm run build
      shell: bash
