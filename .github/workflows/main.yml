name: Main

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  quality:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          working-directory: ./backend

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Run checks
        run: just check-ci

  # The vitest suite needs neither Python nor the database containers, and it does
  # not need the built assets either - it imports straight from src/js and loads the
  # recorded API fixtures from tests/fixtures/json_api. So it runs on its own here
  # rather than inside the Python matrix, where it would be repeated per version.
  # eslint and prettier are not run here - `just check-ci` covers them via prek.
  javascript:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run test

  tests-and-type-check:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:16
        # Provide the password for postgres
        env:
          POSTGRES_DB: opendlp
          POSTGRES_USER: opendlp
          POSTGRES_PASSWORD: abc123 # pragma: allowlist secret
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 54322:5432
      redis:
        # Docker Hub image
        image: redis:alpine
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 63792:6379
    defaults:
      run:
        working-directory: ./backend
        shell: bash
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    env:
      # Make every uv invocation (sync and run) use the matrix interpreter.
      # Without this, uv obeys .python-version (the local dev pin, 3.12) and
      # all three matrix legs silently test the same interpreter.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: ./backend

      # without this, the health check tests might fail
      - name: Create generated_version.txt
        run: git show --no-patch --format='%cd %h' --date=format:'%Y-%m-%d' HEAD > generated_version.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 54322
          DB_NAME: opendlp
        # -n auto: pytest-xdist, one worker per CPU. Each worker gets its own
        # opendlp_test_gwN database (created via the postgres service) and its
        # own Redis database - see tests/conftest.py. BDD stays serial (it
        # manages its own server processes) and runs in bdd.yml.
        run: uv run python -m pytest tests --ignore tests/bdd -n auto --cov --cov-config=pyproject.toml --cov-report=xml --cov-fail-under=80

      - name: Check typing
        run: uv run mypy

      - name: Upload coverage reports to Codecov with GitHub Action on Python 3.12
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: ${{ matrix.python-version == '3.12' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
